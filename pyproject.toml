[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsr"
version = "1.0.0"
description = "Previsão hierárquica de internações por VSR (SRAG, menores de 2 anos) — código compartilhado dos notebooks"
requires-python = ">=3.13,<3.14"

[tool.setuptools.packages.find]
where = ["src"]
